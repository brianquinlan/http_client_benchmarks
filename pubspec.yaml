name: http_client_benchmarks
description: >-
  Benchmarks that compare the performance of package:http Client
  implementations over HTTP/1.1, HTTP/2 and HTTP/3.
repository: https://github.com/brianquinlan/http_client_benchmarks
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  cupertino_http: ^3.1.0
  http: ^1.6.0
  # 3.1.0 is the first release with `Http2Client`.
  http2: ^3.1.0
  path: ^1.9.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.0
  test: ^1.25.0
